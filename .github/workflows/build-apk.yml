name: Build Debug APK

# main 브랜치에 push 되거나, Actions 탭에서 수동으로 실행(workflow_dispatch)할 때 동작
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v5

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK 설정
        # v3 은 Node 20 용이라, 런너가 Node 24 로 강제 실행하면서 SDK 라이선스 동의
        # 단계가 깨졌다(2026-09-20 빌드부터 여기서 멈춤). Node 24 용인 v4 로 올린다.
        uses: android-actions/setup-android@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 디버그 APK 빌드
        # 빌드 출력을 파일로도 남긴다. 실패했을 때 아래 단계에서 원인을 요약하기 위함이다.
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: 빌드 실패 원인 요약
        # 실패했을 때만 돈다. 로그 파일은 로그인해야 받을 수 있어서, 핵심 줄을
        # ::error:: 로 다시 뱉어 화면(과 API)에서 바로 보이게 한다.
        if: failure()
        run: |
          # 빌드 단계 전(환경 설정)에서 죽으면 build.log 자체가 없다. 그때도 빈손으로
          # 끝내지 말고 어디쯤에서 멈췄는지는 알려 준다.
          if [ ! -f build.log ]; then
            echo "::error::빌드 단계 이전에 실패했습니다. 위쪽 스텝(체크아웃/JDK/Android SDK) 로그를 보세요."
            exit 0
          fi
          echo "----- 마지막 120줄 -----"
          tail -n 120 build.log || true
          echo "----- 핵심 오류 -----"
          grep -nE "^e: |error: |FAILURE: |What went wrong|Caused by|Unresolved reference|Could not (find|resolve)" build.log \
            | head -n 10 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v7
        with:
          name: VoiceRecorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
