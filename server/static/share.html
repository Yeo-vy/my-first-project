<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>공유된 스크립트</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <!--
      공유 화면은 로그인하지 않은 사람이 여는 유일한 페이지다.
      /static 은 로그인해야 열리므로 스타일과 스크립트를 이 파일 안에 모두 담아 둔다.
      (여기서 /static/style.css 를 불러오면 공유받은 사람 화면에서 404 가 난다)
    -->
    <style>
        :root {
            --font-sans: Pretendard Variable, Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
                Segoe UI, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

            --bg-page: #121315;
            --bg-surface: #1c1d1f;
            --bg-surface-strong: #2c2d30;
            --border: #3a3b3e;
            --fg: #d6d8dc;
            --fg-weak: #96989d;
            --fg-subtle: #64666b;
            --brand: #4f90fc;
            --brand-weak: #bfd8ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg-page);
            color: var(--fg);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 20px 140px;
        }

        /* --- 머리말 --- */
        header.doc-head {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 8px;
        }

        .read-only-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-surface);
            color: var(--fg-weak);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        h1.doc-title {
            margin: 14px 0 10px;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.02em;
            color: #eff0f2;
            /* 제목도 고칠 수 없다. 본문과 달리 선택은 되게 둔다. */
        }

        .doc-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            color: var(--fg-subtle);
            font-size: 13px;
        }

        .doc-meta .dot { color: var(--border); }

        .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
        }

        .keyword {
            padding: 3px 9px;
            border-radius: 6px;
            background: var(--bg-surface-strong);
            color: var(--fg-weak);
            font-size: 12.5px;
        }

        /* --- 스크립트 --- */
        .script { margin-top: 26px; }

        .para {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            scroll-margin-top: 24px;
        }

        .para + .para { margin-top: 2px; }

        .para.playing { background: rgba(79, 144, 252, 0.10); }

        .para-time {
            padding-top: 2px;
            border: 0;
            background: none;
            color: var(--fg-subtle);
            font-family: var(--font-mono);
            font-size: 12.5px;
            text-align: left;
            cursor: pointer;
        }

        .para-time:hover { color: var(--brand); }
        .para.playing .para-time { color: var(--brand); }

        .para-speaker {
            margin-bottom: 2px;
            color: var(--fg-weak);
            font-size: 12.5px;
            font-weight: 600;
        }

        .para-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* --- 재생 막대 --- */
        .player-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
            background: rgba(18, 19, 21, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
        }

        .player-inner {
            max-width: 860px;
            margin: 0 auto;
        }

        audio {
            width: 100%;
            height: 38px;
        }

        /* --- 상태 표시 --- */
        .state {
            padding: 60px 20px;
            text-align: center;
            color: var(--fg-subtle);
        }

        .state h2 {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 600;
            color: var(--fg-weak);
        }

        .foot-note {
            margin-top: 34px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--fg-subtle);
            font-size: 12.5px;
        }

        @media (max-width: 640px) {
            .wrap { padding: 22px 16px 140px; }
            h1.doc-title { font-size: 21px; }
            .para {
                grid-template-columns: 54px 1fr;
                gap: 10px;
                padding: 9px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div id="state" class="state">
            <h2>불러오는 중…</h2>
        </div>

        <div id="doc" hidden>
            <header class="doc-head">
                <span class="read-only-badge">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    읽기 전용으로 공유된 스크립트
                </span>
                <h1 class="doc-title" id="title"></h1>
                <div class="doc-meta">
                    <span id="created"></span>
                    <span class="dot" id="meta-dot" hidden>·</span>
                    <span id="duration"></span>
                </div>
                <div class="keywords" id="keywords"></div>
            </header>

            <div class="script" id="script"></div>

            <p class="foot-note">이 링크를 가진 사람은 이 스크립트만 볼 수 있습니다. 내용은 수정할 수 없습니다.</p>
        </div>
    </div>

    <div class="player-bar" id="player-bar" hidden>
        <div class="player-inner">
            <audio id="audio" controls preload="metadata" controlsList="nodownload"></audio>
        </div>
    </div>

    <script>
    (function () {
        "use strict";

        // 주소 /share/<토큰> 의 마지막 칸이 토큰이다.
        var token = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).pop() || "");

        var stateBox = document.getElementById("state");
        var doc = document.getElementById("doc");
        var audio = document.getElementById("audio");
        var scriptBox = document.getElementById("script");
        var paragraphs = [];

        function showState(heading, detail) {
            stateBox.hidden = false;
            doc.hidden = true;
            stateBox.innerHTML = "";
            var h = document.createElement("h2");
            h.textContent = heading;
            stateBox.appendChild(h);
            if (detail) {
                var p = document.createElement("p");
                p.textContent = detail;
                stateBox.appendChild(p);
            }
        }

        function formatTime(ms) {
            var total = Math.max(0, Math.floor((ms || 0) / 1000));
            var h = Math.floor(total / 3600);
            var m = Math.floor((total % 3600) / 60);
            var s = total % 60;
            var mm = String(m).padStart(2, "0");
            var ss = String(s).padStart(2, "0");
            return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
        }

        function renderKeywords(list) {
            var box = document.getElementById("keywords");
            box.innerHTML = "";
            (list || []).forEach(function (word) {
                var chip = document.createElement("span");
                chip.className = "keyword";
                chip.textContent = word;
                box.appendChild(chip);
            });
        }

        function renderScript(segments) {
            scriptBox.innerHTML = "";
            paragraphs = [];

            if (!segments || !segments.length) {
                var empty = document.createElement("p");
                empty.style.color = "var(--fg-subtle)";
                empty.textContent = "아직 스크립트가 없습니다.";
                scriptBox.appendChild(empty);
                return;
            }

            var lastSpeaker = null;
            segments.forEach(function (seg) {
                var startMs = seg.start_time_ms || 0;

                var row = document.createElement("div");
                row.className = "para";
                row.dataset.ms = String(startMs);
                row.dataset.endMs = String(seg.end_time_ms || startMs + 5000);

                var time = document.createElement("button");
                time.type = "button";
                time.className = "para-time";
                time.textContent = formatTime(startMs);
                time.title = "이 지점부터 듣기";
                time.addEventListener("click", function () { seekTo(startMs); });
                row.appendChild(time);

                var body = document.createElement("div");
                if (seg.speaker && seg.speaker !== lastSpeaker) {
                    var who = document.createElement("div");
                    who.className = "para-speaker";
                    who.textContent = seg.speaker;
                    body.appendChild(who);
                    lastSpeaker = seg.speaker;
                }

                var text = document.createElement("div");
                text.className = "para-text";
                // 본문은 textContent 로만 넣는다. 받아쓴 글에 태그처럼 보이는 문자가 섞여도
                // 그대로 글자로 보여야 하고, 공유 화면에서 스크립트가 실행되면 안 된다.
                text.textContent = seg.content || "";
                body.appendChild(text);

                row.appendChild(body);
                scriptBox.appendChild(row);
                paragraphs.push(row);
            });
        }

        function seekTo(ms) {
            if (!audio.src) return;
            audio.currentTime = ms / 1000;
            audio.play().catch(function () { /* 사용자가 재생을 막아 둔 경우 */ });
        }

        function highlightPlaying() {
            var nowMs = audio.currentTime * 1000;
            paragraphs.forEach(function (row) {
                var start = parseInt(row.dataset.ms, 10) || 0;
                var end = parseInt(row.dataset.endMs, 10) || start + 5000;
                row.classList.toggle("playing", nowMs >= start && nowMs < end);
            });
        }

        audio.addEventListener("timeupdate", highlightPlaying);

        fetch("/api/share/" + encodeURIComponent(token), { headers: { "Accept": "application/json" } })
            .then(function (res) {
                if (res.status === 404) throw new Error("expired");
                if (!res.ok) throw new Error("failed");
                return res.json();
            })
            .then(function (data) {
                document.title = (data.title || "공유된 스크립트") + " · 읽기 전용";
                document.getElementById("title").textContent = data.title || "제목 없음";
                document.getElementById("created").textContent = data.created_at || "";
                document.getElementById("duration").textContent = data.duration_str || "";
                document.getElementById("meta-dot").hidden = !(data.created_at && data.duration_str);

                renderKeywords(data.keywords);
                renderScript(data.segments);

                if (data.has_audio && data.audio_url) {
                    audio.src = data.audio_url;
                    document.getElementById("player-bar").hidden = false;
                }

                stateBox.hidden = true;
                doc.hidden = false;
            })
            .catch(function (err) {
                if (err && err.message === "expired") {
                    showState("링크를 열 수 없습니다.", "공유가 해제되었거나 주소가 잘못되었습니다.");
                } else {
                    showState("내용을 불러오지 못했습니다.", "잠시 후 다시 시도해 주세요.");
                }
            });
    })();
    </script>
</body>
</html>
